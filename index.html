<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JW Follow-up</title>
<meta name="theme-color" content="#1a7cf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JW Follow-up">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#16262b;--sub:#5d6f75;--line:#d3dde0;--pri:#17614f;--pri-ink:#fff;--warn:#b3321f;--soft:#dcebe6;--s1:#17614f;--s2:#5d6f75;--s3:#c0291b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--card:#182429;--ink:#e8f0f2;--sub:#97aab0;--line:#2b3b41;--pri:#4fb597;--pri-ink:#06231b;--warn:#ff8a78;--soft:#1d3a33;--s1:#4fb597;--s2:#97aab0;--s3:#ff8a78}}
:root[data-theme="dark"]{--bg:#0f1a1d;--card:#182429;--ink:#e8f0f2;--sub:#97aab0;--line:#2b3b41;--pri:#4fb597;--pri-ink:#06231b;--warn:#ff8a78;--soft:#1d3a33;--s1:#4fb597;--s2:#97aab0;--s3:#ff8a78}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:22px;margin:8px 0 2px}
h2{font-size:15px;color:var(--sub);margin:18px 0 8px}
.sub{color:var(--sub);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.f,.f-title{display:block;font-weight:600;margin-bottom:8px}
input[type=text],textarea,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
textarea{min-height:76px;resize:vertical}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--pri);color:var(--pri-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px}
.ghost{background:var(--soft);color:var(--ink)}
.danger{background:transparent;color:var(--warn);padding:6px 10px}
.wide{width:100%}
.photo{display:grid;place-items:center;min-height:170px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.photo img{width:100%;display:block}
.photo span{color:var(--sub)}
.gps{margin-top:10px;font-size:14px;color:var(--sub)}
.gps b{color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0}
.seg label{flex:1;min-width:72px;text-align:center;padding:11px 6px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg);font-weight:600}
.seg input:checked+label{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.seg input:focus-visible+label{outline:3px solid var(--pri);outline-offset:1px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tools .full{grid-column:1/-1}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.bar>div{max-width:560px;margin:auto;display:flex;gap:10px}
.rec{display:flex;gap:12px}
.rec img,.rec .ph{width:80px;height:80px;object-fit:cover;border-radius:10px;flex:none;background:var(--bg)}
.rec h3{margin:0;font-size:17px}
.meta{color:var(--sub);font-size:13px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:999px;border:1.5px solid currentColor;margin-left:6px;vertical-align:1px}
.s-續訪中{color:var(--s1)}.s-停止續訪{color:var(--s2)}.s-不接受傳道{color:var(--s3)}
.c-續訪中{--sc:var(--s1)}.c-停止續訪{--sc:var(--s2)}.c-不接受傳道{--sc:var(--s3)}
.rec{border-left:6px solid var(--sc,var(--line))}
h2.s-續訪中,h2.s-停止續訪,h2.s-不接受傳道{font-weight:700;border-bottom:2px solid currentColor;padding-bottom:4px}
#s1:checked+label{background:var(--s1);border-color:var(--s1);color:var(--pri-ink)}#s2:checked+label{background:var(--s2);border-color:var(--s2);color:var(--pri-ink)}#s3:checked+label{background:var(--s3);border-color:var(--s3);color:var(--pri-ink)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row .btn,.row button{min-height:36px;padding:5px 12px;font-size:14px}
.empty{text-align:center;color:var(--sub);padding:36px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>
<main>
 <section id="list">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1>續訪記錄</h1><select id="lang" aria-label="Language" style="width:auto;font-size:14px;padding:6px 8px"><option value="auto">Auto / 自動</option><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option><option value="id">Bahasa Indonesia</option><option value="th">ภาษาไทย</option><option value="ko">한국어</option><option value="fil">Filipino</option><option value="es">Español</option></select></div>
  <p class="sub" id="count"></p>
  <div class="tools">
   <input type="text" id="q" placeholder="搜尋姓名、地區、話題" aria-label="搜尋">
   <select id="stFilter" aria-label="依狀態篩選"><option value="">所有狀態</option><option value="續訪中">續訪中</option><option value="停止續訪">停止續訪</option><option value="不接受傳道">不接受傳道</option></select>
   <select id="group" aria-label="分類方式" class="full"><option value="region">依地區分類</option><option value="name">依姓名排序</option><option value="status">依目前狀態分類</option></select>
   <button class="ghost" id="xls">匯出 Excel</button>
   <button class="ghost" id="cloudMenu">備份與還原</button>
  </div>
  <div id="cloudBox" class="card hide">
   <div class="sub">備份檔包含所有記錄與照片。匯出後請存到 Google Drive、iCloud,或傳給自己;換手機時按「匯入備份檔」還原。</div>
   <div class="row"><button id="up">匯出備份檔</button><button class="ghost" id="down">匯入備份檔</button></div>
   <input type="file" id="imp" accept=".json,application/json" class="hide">
  </div>
  <div id="items"></div>
 </section>

 <section id="form" class="hide">
  <h1 id="ftitle">新增訪視</h1>
  <p class="sub">拍照時會自動記錄目前位置。</p>
  <div class="card">
   <span class="f-title">拍照與位置</span>
   <div class="photo" id="photoBox"><span>尚未拍照</span></div>
   <input type="file" id="cam" accept="image/*" capture="environment" class="hide">
   <button class="wide ghost" id="shoot" style="margin-top:10px">開啟相機拍照</button>
   <div class="gps" id="gps">座標:<b>尚未取得</b></div>
   <div class="row" id="navRow"></div>
  </div>
  <div class="card"><label class="f" for="name">住戶姓名</label><input type="text" id="name" autocomplete="off" placeholder="請輸入姓名"></div>
  <div class="card"><label class="f" for="region">地區(依 GPS 自動填入)</label>
   <div style="display:flex;gap:8px"><input type="text" id="region" list="regions" autocomplete="off" placeholder="拍照後自動填入市、區、鄉鎮" style="flex:1"><button class="ghost" id="loc" type="button">定位</button></div>
   <datalist id="regions"></datalist>
   <div class="meta" id="rhint" style="margin-top:6px">拍照或按「定位」後會自動填入,也可手動修改。</div></div>
  <div class="card"><span class="f-title">住戶性別</span>
   <div class="seg"><input type="radio" name="g" id="gm" value="男"><label for="gm">男</label><input type="radio" name="g" id="gf" value="女"><label for="gf">女</label></div></div>
  <div class="card"><label class="f" for="mat">分發的資料</label><textarea id="mat" placeholder="例如:單張 2 份、手冊 1 本"></textarea></div>
  <div class="card"><label class="f" for="topic">住戶感興趣的話題</label><textarea id="topic" placeholder="例如:家庭、健康、聖經預言"></textarea></div>
  <div class="card"><label class="f" for="note">備註</label><textarea id="note" placeholder="其他需要記住的事"></textarea></div>
  <div class="card"><span class="f-title">目前狀態</span>
   <div class="seg"><input type="radio" name="s" id="s1" value="續訪中"><label for="s1">續訪中</label><input type="radio" name="s" id="s2" value="停止續訪"><label for="s2">停止續訪</label><input type="radio" name="s" id="s3" value="不接受傳道"><label for="s3">不接受傳道</label></div></div>
 </section>
</main>

<div class="bar"><div id="barList"><button class="wide" id="add">+ 新增訪視</button></div>
 <div id="barForm" class="hide"><button class="ghost" id="cancel" style="flex:1">取消</button><button id="save" style="flex:2">儲存</button></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
 var KEY='followup-records-v2',recs=[],cur={},editId=null;
 var $=function(i){return document.getElementById(i)};
 function idb(){return new Promise(function(res,rej){var q=indexedDB.open('jw-followup',1);q.onupgradeneeded=function(){q.result.createObjectStore('kv')};q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
 function idbGet(){return idb().then(function(d){return new Promise(function(res,rej){var r=d.transaction('kv').objectStore('kv').get('recs');r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})})}
 function idbSet(v){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,'recs');t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
 function persist(){idbSet(recs).catch(function(){toast('儲存失敗,請先匯出備份檔')});return true}
 function toast(t){var el=$('toast');el.textContent=T(t);el.classList.add('on');setTimeout(function(){el.classList.remove('on')},2600)}
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function nav(lat,lng){return 'https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng}
 function navBtn(lat,lng){return '<a class="btn ghost" target="_blank" rel="noopener" href="'+nav(lat,lng)+'">'+T('Google 地圖導航')+'</a>'}
 function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
 
 function filtered(){
  var q=$('q').value.trim().toLowerCase(),st=$('stFilter').value;
  return recs.filter(function(r){
   if(st&&r.status!==st)return false;
   return !q||[r.name,r.region,r.topic,r.note,r.items].join(' ').toLowerCase().indexOf(q)>=0;
  });
 }
 function card(r){
  return '<div class="card rec c-'+esc(r.status)+'">'+(r.photo?'<img alt="'+T('現場照片')+'" src="'+r.photo+'">':'<div class="ph"></div>')+
  '<div style="min-width:0;flex:1"><h3>'+esc(r.name)+'('+esc(T(r.gender))+')<span class="tag s-'+esc(r.status)+'">'+esc(T(r.status))+'</span></h3>'+
  '<div class="meta">'+esc(r.region||T('未填地區'))+' · '+esc(r.time)+'</div>'+
  (r.items?'<div>'+T('分發:')+esc(r.items)+'</div>':'')+(r.topic?'<div>'+T('話題:')+esc(r.topic)+'</div>':'')+(r.note?'<div class="meta">'+T('備註:')+esc(r.note)+'</div>':'')+
  '<div class="row"><button data-edit="'+r.id+'>'+T('編輯')+'</button>'+(r.lat!=null?navBtn(r.lat,r.lng):'')+'<button class="danger" data-del="'+r.id+'>'+T('刪除')+'</button></div></div></div>';
 }
 function render(){
  var list=filtered(),g=$('group').value;
  $('count').textContent=recs.length?F('共 {n} 筆,顯示 {m} 筆',{n:recs.length,m:list.length}):'';
  var rs={};recs.forEach(function(r){if(r.region)rs[r.region]=1});
  $('regions').innerHTML=Object.keys(rs).map(function(x){return '<option value="'+esc(x)+'">'}).join('');
  if(!recs.length){$('items').innerHTML='<div class="empty">'+T('還沒有記錄。按下方「新增訪視」開始第一筆。')+'</div>';return}
  if(!list.length){$('items').innerHTML='<div class="empty">'+T('沒有符合條件的記錄。')+'</div>';return}
  var key=function(r){return g==='status'?r.status:g==='region'?(r.region||'未填地區'):''};
  list.sort(function(a,b){return g==='name'?a.name.localeCompare(b.name,'zh-Hant'):(key(a).localeCompare(key(b),'zh-Hant')||a.name.localeCompare(b.name,'zh-Hant'))});
  var h='',last=null;
  list.forEach(function(r){
   if(g!=='name'&&key(r)!==last){last=key(r);var n=list.filter(function(x){return key(x)===last}).length;h+='<h2'+(g==='status'?' class="s-'+esc(last)+'"':'')+'>'+esc(g==='status'||last==='未填地區'?T(last):last)+'('+n+')</h2>'}
   h+=card(r);
  });
  $('items').innerHTML=h;
 }

 function show(f){
  $('list').classList.toggle('hide',f);$('form').classList.toggle('hide',!f);
  $('barList').classList.toggle('hide',f);$('barForm').classList.toggle('hide',!f);
  window.scrollTo(0,0);
 }
 function setPhoto(d){$('photoBox').innerHTML=d?'<img alt="'+T('照片')+'" src="'+d+'">':'<span>'+T('尚未拍照')+'</span>'}
 function setGps(){
  if(cur.lat!=null){$('gps').innerHTML=T('座標:')+'<b>'+cur.lat.toFixed(6)+', '+cur.lng.toFixed(6)+'</b>';$('navRow').innerHTML=navBtn(cur.lat,cur.lng)}
  else{$('gps').innerHTML=T('座標:')+'<b>'+T('尚未取得')+'</b>';$('navRow').innerHTML=''}
 }
 function fill(r){
  r=r||{};cur={photo:r.photo||'',lat:r.lat==null?null:r.lat,lng:r.lng==null?null:r.lng};
  setPhoto(cur.photo);setGps();
  $('name').value=r.name||'';$('region').value=r.region||'';$('mat').value=r.items||'';$('topic').value=r.topic||'';$('note').value=r.note||'';
  document.querySelectorAll('input[name=g],input[name=s]').forEach(function(x){x.checked=(x.value===r.gender||x.value===r.status)});
  if(!r.id)$('s1').checked=true;
  $('cam').value='';autoReg='';$('rhint').textContent=T('拍照或按「定位」後會自動填入,也可手動修改。');
 }
 function getGps(){
  $('gps').innerHTML=T('座標:')+'<b>'+T('定位中…')+'</b>';
  if(!navigator.geolocation){$('gps').innerHTML=T('座標:')+'<b>'+T('此裝置不支援定位')+'</b>';return}
  navigator.geolocation.getCurrentPosition(function(p){cur.lat=p.coords.latitude;cur.lng=p.coords.longitude;setGps();fillRegion()},
   function(){$('gps').innerHTML=T('座標:')+'<b>'+T('無法取得')+'</b>'+T('(請允許位置權限後重新拍照)')},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
 }
 function shrink(file,cb){
  var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');
   c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.65))};im.src=rd.result};
  rd.readAsDataURL(file);
 }
/* ===== GPS 轉地區(市、區、鄉鎮):OpenStreetMap Nominatim,需連網 ===== */
 var autoReg='',bf=false;
 async function regionOf(lat,lng){
  try{
   var c=new AbortController(),t=setTimeout(function(){c.abort()},9000);
   var r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&addressdetails=1&accept-language='+LANGS[LI]+'&lat='+lat+'&lon='+lng,{signal:c.signal});
   clearTimeout(t);if(!r.ok)return '';
   var a=(await r.json()).address||{},p1,p2;
   if(a.county&&a.city){p1=a.county;p2=a.city}
   else{p1=a.city||a.county||(a.state&&a.state.indexOf('省')<0?a.state:'')||'';
    p2=a.city_district||a.suburb||a.town||a.township||a.municipality||a.borough||''}
   if(p2===p1)p2='';
   return (p1+p2).trim();
  }catch(e){return ''}
 }
 async function fillRegion(){
  if(cur.lat==null)return;
  var h=$('rhint');h.textContent=T('正在取得地區…');
  var g=await regionOf(cur.lat,cur.lng);
  if(g){var v=$('region').value.trim();if(!v||v===autoReg)$('region').value=g;autoReg=g;h.textContent=F('已由 GPS 取得:{g}(可修改)',{g:g})}
  else h.textContent=navigator.onLine?T('暫時無法取得地區,可手動輸入。'):T('目前離線,無法自動取得地區;連網後會自動補上,也可先手動輸入。');
 }
 async function backfill(){
  if(bf||!navigator.onLine)return;bf=true;var ch=false;
  for(var i=0;i<recs.length;i++){var r=recs[i];
   if(r.lat!=null&&!r.region){var g=await regionOf(r.lat,r.lng);if(g){r.region=g;ch=true}await new Promise(function(x){setTimeout(x,1100)})}}
  if(ch){persist();render()}bf=false;
 }
 $('loc').onclick=getGps;
 $('shoot').onclick=function(){$('cam').click()};
 $('cam').onchange=function(){var f=this.files&&this.files[0];if(!f)return;getGps();shrink(f,function(d){cur.photo=d;setPhoto(d)})};
 $('add').onclick=function(){editId=null;$('ftitle').textContent=T('新增訪視');fill();show(true)};
 $('cancel').onclick=function(){show(false)};
 $('save').onclick=function(){
  var name=$('name').value.trim(),g=document.querySelector('input[name=g]:checked'),s=document.querySelector('input[name=s]:checked');
  if(!name){toast('請輸入住戶姓名');$('name').focus();return}
  if(!g){toast('請選擇性別');return}
  if(!s){toast('請選擇目前狀態');return}
  var data={name:name,gender:g.value,status:s.value,region:$('region').value.trim(),items:$('mat').value.trim(),topic:$('topic').value.trim(),note:$('note').value.trim(),photo:cur.photo,lat:cur.lat,lng:cur.lng};
  var before=JSON.stringify(recs);
  if(editId){recs=recs.map(function(r){return r.id===editId?Object.assign({},r,data,{edited:new Date().toLocaleString('zh-TW',{hour12:false})}):r})}
  else{data.id=uid();data.time=new Date().toLocaleString('zh-TW',{hour12:false});recs.unshift(data)}
  if(persist()){toast('已儲存');show(false);render();backfill()}else{recs=JSON.parse(before)}
 };
 $('items').onclick=function(e){
  var t=e.target,ed=t.getAttribute&&t.getAttribute('data-edit'),dl=t.getAttribute&&t.getAttribute('data-del');
  if(ed){var r=recs.filter(function(x){return x.id===ed})[0];if(r){editId=ed;$('ftitle').textContent=T('編輯記錄');fill(r);show(true)}}
  if(dl&&confirm(T('確定刪除這筆記錄?'))){recs=recs.filter(function(x){return x.id!==dl});persist();render()}
 };
 ['q','stFilter','group'].forEach(function(i){$(i).oninput=render});

 /* ===== 離線版:Excel 匯出(內建,不需外部元件)===== */
 var CT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
 function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
 function zip(files,mime){
  var enc=new TextEncoder(),parts=[],cent=[],off=0;
  files.forEach(function(f){
   var nm=enc.encode(f.n),d=enc.encode(f.d),crc=crc32(d),h=new DataView(new ArrayBuffer(30));

 async function saveFile(name,blob){
  try{var f=new File([blob],name,{type:blob.type});
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);return true;
 }

 $('imp').onchange=function(){
  var inp=this,f=inp.files&&inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
   try{
    var o=JSON.parse(rd.result),list=Array.isArray(o)?o:o.records;if(!Array.isArray(list))throw 0;
    var have={},add=0,upd=0;recs.forEach(function(r){have[r.id]=r});
    list.forEach(function(c){
     if(!c||!c.id||!c.name)return;
     if(!have[c.id]){recs.push(c);have[c.id]=c;add++}
     else if((c.edited||c.time||'')>(have[c.id].edited||have[c.id].time||'')){recs=recs.map(function(r){return r.id===c.id?c:r});upd++}
    });
    persist();render();toast(F('還原完成:新增 {a} 筆,更新 {u} 筆',{a:add,u:upd}));
   }catch(e){toast('備份檔格式不正確')}
   inp.value='';
  };
  rd.readAsText(f);
 };

 function pickLang(){
  var p='auto';try{p=localStorage.getItem('jw-lang')||'auto'}catch(e){}
  if(LANGS.indexOf(p)>=0)return p;
  var l=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];

  return 'en';
